name: Performance profile
# Compare the performance profile of the base and the head of a pull request.
# See docs/products/kuromojin/features/performance-profile/
#
# This workflow runs the code of the pull request, including a pull request from a fork.
# Do not change it to pull_request_target, and do not give it secrets or write permissions.
on:
  pull_request:
    paths:
      - "src/**"
      - "dict/**"
      - "benchmark/**"
      - "package.json"
      - "yarn.lock"
      - "tsconfig.json"
      - ".github/workflows/profile.yml"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    name: compare with the base
    runs-on: ubuntu-latest
    # A base that analyzes with kuromoji.js takes most of this time. Two builds of this analyzer take a few minutes
    timeout-minutes: 60
    steps:
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # the base commit is needed for its worktree
          fetch-depth: 0
          persist-credentials: false
      - name: setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "lts/*"
      - name: Install
        run: yarn install --frozen-lockfile --ignore-scripts
      - name: Compare the base and the head
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # The Markdown goes to the log too. `shell: bash` fails the step when the comparison fails before `tee`
        shell: bash
        run: node benchmark/compare.js --base "$BASE_SHA" --out-dir profile-result | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload the result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-profile
          path: profile-result/
          if-no-files-found: error
